# Identity of user-service (User accounts and JWT issuing); sizing comes from envs/<env>/values.yaml.
image:
  repository: ghcr.io/andresazcona/k8s-gitops-platform/user-service
secretEnv:
  MONGODB_PASSWORD: {secret: mongodb-credentials, key: user-service}
  JWT_SECRET: {secret: jwt, key: secret}
env:
  # Own database and user per service (created by platform/mongodb/init-users.js).
  MONGODB_URI: mongodb://user-service:$(MONGODB_PASSWORD)@mongodb.data.svc:27017/users
otel:
  instrumentations: http,express,mongodb,mongoose
networkPolicy:
  allowFrom:
    - podSelector: {matchLabels: {app.kubernetes.io/name: api-gateway}}
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: data}}
          podSelector: {matchLabels: {app.kubernetes.io/name: mongodb}}
      ports: [{port: 27017}]
