# Single-replica MongoDB for the shop. One database + one least-privilege user per service.
# Credentials live in Secret data/mongodb-auth (created out of band, see scripts/up.sh).
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels: {app.kubernetes.io/name: mongodb}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: mongodb}
  ports:
    - {name: mongodb, port: 27017, targetPort: mongodb}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels: {app.kubernetes.io/name: mongodb}
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mongodb}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mongodb}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999   # "mongodb" user of the official image
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongodb
          image: mongo:8.0.16
          args: [--wiredTigerCacheSizeGB, "0.25"]
          ports:
            - {name: mongodb, containerPort: 27017}
          env:
            - {name: HOME, value: /tmp}   # mongosh keeps its history here; the root filesystem is read-only
            - {name: MONGO_INITDB_ROOT_USERNAME, value: root}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mongodb-auth, key: root-password}}
            - name: USER_SERVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: mongodb-auth, key: user-service}}
            - name: PRODUCT_SERVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: mongodb-auth, key: product-service}}
            - name: ORDER_SERVICE_PASSWORD
              valueFrom: {secretKeyRef: {name: mongodb-auth, key: order-service}}
          readinessProbe:
            tcpSocket: {port: mongodb}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: mongodb}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: configdb, mountPath: /data/configdb}
            - {name: tmp, mountPath: /tmp}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: configdb, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: init
          configMap: {name: mongodb-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
---
# Only workloads in the shop namespace may talk to the database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mongodb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: shop}}
      ports: [{port: 27017}]
