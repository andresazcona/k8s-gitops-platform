# Root of the app-of-apps for the prod cluster: kubectl apply -n argocd -f gitops/bootstrap/root-prod.yaml
# The root always auto-syncs (it only manages Application objects); children follow values-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andresazcona/k8s-gitops-platform.git
    targetRevision: main
    path: gitops/apps
    helm:
      valueFiles: [values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}
