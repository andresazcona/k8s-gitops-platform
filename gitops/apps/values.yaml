# Shared by every environment; values-<env>.yaml sets env and autoSync.
repoURL: https://github.com/andresazcona/k8s-gitops-platform.git
targetRevision: main

# Sync waves: CRDs and the cluster plumbing first, data next, then services, gateway last.
addons:
  - name: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    version: 92.3.1
    namespace: observability
    wave: -3
    serverSideApply: true   # CRDs exceed the client-side apply annotation limit
  - name: metrics-server
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.14.0
    namespace: kube-system
    wave: -3
  - name: ingress-nginx
    repoURL: https://kubernetes.github.io/ingress-nginx
    version: 4.15.1
    namespace: ingress-nginx
    wave: -2
  - name: tempo
    repoURL: https://grafana.github.io/helm-charts
    version: 1.24.4
    namespace: observability
    wave: -2
  - name: opentelemetry-collector
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.176.0
    namespace: observability
    wave: -1

# Plain kustomize directories in this repo.
manifests:
  - {name: mongodb, path: platform/mongodb, namespace: data, wave: 0}
  - {name: dashboards, path: platform/dashboards, namespace: observability, wave: 0}

# Every service uses charts/service with apps/<name>/values.yaml + envs/<env>/values.yaml.
services:
  - {name: user-service, wave: 1}
  - {name: product-service, wave: 1}
  - {name: order-service, wave: 2}   # calls product-service
  - {name: api-gateway, wave: 3}
