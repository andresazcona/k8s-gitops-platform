apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "service.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      {{- if .Values.topologySpread }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "service.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.containerPort }}}
            - {name: metrics, containerPort: {{ .Values.metricsPort }}}
          env:
            {{- range $name, $ref := .Values.secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef: {name: {{ $ref.secret }}, key: {{ $ref.key }}}
            {{- end }}
            - {name: PORT, value: {{ .Values.containerPort | quote }}}
            {{- range $name, $value := .Values.env }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: OTEL_SERVICE_NAME, value: {{ include "service.name" . }}}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace={{ .Release.Namespace }},deployment.environment.name={{ .Values.otel.environment }},k8s.pod.name=$(POD_NAME)"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }}}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_TRACES_EXPORTER, value: otlp}
            - {name: OTEL_METRICS_EXPORTER, value: prometheus}
            - {name: OTEL_EXPORTER_PROMETHEUS_PORT, value: {{ .Values.metricsPort | quote }}}
            - {name: OTEL_LOGS_EXPORTER, value: none}
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: http}
            - {name: OTEL_NODE_ENABLED_INSTRUMENTATIONS, value: {{ .Values.otel.instrumentations | quote }}}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readinessPath }}, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: {{ .Values.probes.livenessPath }}, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            # Keep serving while the endpoint is removed from Services/Ingress, then SIGTERM.
            preStop:
              sleep: {seconds: 5}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
